<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Feedback Form</title>
<link rel="stylesheet" href="student-feedback.css">
</head>
<body>

<div class="container">
  <h1>Student Feedback Form</h1>
  <p class="subtitle">We value your feedback — please fill out the form below</p>

  <div class="card">
    <div id="sessionInfo" class="session-info"></div>
    <div id="successBanner"></div>

    <form id="feedbackForm" novalidate>
      <div class="field" id="field-name">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName" autocomplete="off">
        <div class="error-msg">Student name is required.</div>
      </div>

      <div class="field" id="field-email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="off">
        <div class="error-msg">Please enter a valid email address.</div>
      </div>

      <div class="field" id="field-course">
        <label for="course">Course</label>
        <select id="course" name="course">
          <option value="">-- Select a course --</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Electronics">Electronics</option>
          <option value="Mechanical Engineering">Mechanical Engineering</option>
          <option value="Business Administration">Business Administration</option>
          <option value="Mathematics">Mathematics</option>
        </select>
        <div class="error-msg">Please select a course.</div>
      </div>

      <div class="field" id="field-feedback">
        <label for="feedback">Feedback</label>
        <textarea id="feedback" name="feedback"></textarea>
        <div class="error-msg">Feedback cannot be empty.</div>
      </div>

      <div class="btn-row">
        <button type="submit" id="submitBtn">Submit Feedback</button>
        <button type="button" id="deleteBtn">Delete Stored Data</button>
      </div>
    </form>
  </div>

  <div class="card" id="storedCard">
    <div class="stored-title">Stored Feedback</div>
    <div id="storedContent"></div>
  </div>
</div>


<script src="student-feedback.js"></script>



</body>
</html>
